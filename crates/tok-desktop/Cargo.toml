[package]
name = "tok-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
tok-core = { workspace = true }
tok-engine-service = { workspace = true }
tok-pdf = { workspace = true }
tok-typeset = { workspace = true }
tok-layout-analyzer = { workspace = true }
tok-storage = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
flate2 = "1.1"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
ed25519-dalek = { version = "2", features = ["std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
