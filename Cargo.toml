[workspace]
resolver = "2"
members = [
    "crates/tok-core",
    "crates/tok-typeset",
    "crates/tok-pdf",
    "crates/tok-storage",
    "crates/tok-ipc",
    "crates/tok-plugin-host",
    "crates/tok-cli",
]

[workspace.package]
version = "0.35.0"
edition = "2021"
authors = ["TypesetOK Core Team"]
license-file = "LICENSE.md"

[workspace.dependencies]
# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = "1.1"
ropey = "1.6"
rayon = "1.10"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.13"

# Typography, Layout & Geometry
rustybuzz = "0.18"
unicode-bidi = "0.3"
unicode-normalization = "0.1"
cassowary = "0.3"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
zstd = "0.13"
zip = { version = "9.1", default-features = false, features = ["deflate"] }
tempfile = "3.10"
sha2 = "0.11"

# PDF
pdf-writer = "0.12"

# Internal crates
tok-core = { path = "crates/tok-core" }
tok-typeset = { path = "crates/tok-typeset" }
tok-pdf = { path = "crates/tok-pdf" }
tok-storage = { path = "crates/tok-storage" }
tok-ipc = { path = "crates/tok-ipc" }
tok-plugin-host = { path = "crates/tok-plugin-host" }
