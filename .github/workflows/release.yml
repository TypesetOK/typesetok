name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.34.3)'
        required: false
        default: 'v0.34.3'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_TARGET_DIR: target

jobs:
  # ──────────────────────────────────────────────
  # 0. Check if release build is needed
  # ──────────────────────────────────────────────
  check-release:
    name: Check Release Trigger
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag and check existing release
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            # Push to main: extract version from package.json
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Release for $TAG already exists (HTTP 200). Skipping release build."
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "Release for $TAG does not exist (HTTP $HTTP_STATUS). Starting release build for $TAG!"
              echo "should_release=true" >> $GITHUB_OUTPUT
            fi
          fi

  # ──────────────────────────────────────────────
  # 1. Build tok-cli native binaries for all platforms
  # ──────────────────────────────────────────────
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup (Windows Installer)
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - uses: Swatinem/rust-cache@v2

      - name: Build tok-cli (Release)
        run: cargo build --release -p tok-cli

      - name: Package binary (Windows)
        shell: pwsh
        run: |
          $tag = "${{ needs.check-release.outputs.tag_name }}"
          Compress-Archive -Path target/release/tok-cli.exe -DestinationPath "tok-cli-${tag}-windows-x64.zip"

      - name: Setup Node.js (Windows Desktop App)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package Standalone Desktop App (Windows)
        shell: pwsh
        run: |
          $tag = "${{ needs.check-release.outputs.tag_name }}"
          $ver = $tag.TrimStart('v')
          npm install
          npm run build
          node scripts/build-desktop-bundle.mjs
          $bundlePath = "dist/TypesetOK-${tag}-windows-x64"
          if (-not (Test-Path $bundlePath)) {
            $bundlePath = "dist/TypesetOK-v${ver}-windows-x64"
          }
          Compress-Archive -Path $bundlePath -DestinationPath "TypesetOK-${tag}-windows-desktop-app.zip"

      - name: Compile Official Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $tag = "${{ needs.check-release.outputs.tag_name }}"
          $ver = $tag.TrimStart('v')
          node scripts/build-installer.mjs
          $setupSrc = "dist/TypesetOK-${tag}-Setup-x64.exe"
          if (-not (Test-Path $setupSrc)) {
            $setupSrc = "dist/TypesetOK-v${ver}-Setup-x64.exe"
          }
          Copy-Item $setupSrc "TypesetOK-${tag}-Setup.exe"

      - name: Upload Windows Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: TypesetOK-*-Setup.exe

      - name: Upload Desktop App artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: TypesetOK-*-windows-desktop-app.zip

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tok-cli-binary
          path: tok-cli-*-windows-x64.zip

  # ──────────────────────────────────────────────
  # 2. Build Frontend & UI Workbench Distribution
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend UI Distribution
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript packages & UI bundle
        run: npm run build

      - name: Package UI distribution bundle
        run: |
          mkdir -p dist-package
          cp -r packages/tok-ui/dist dist-package/ui
          cp -r packages/tok-electron/dist dist-package/electron
          cp -r assets dist-package/assets
          cp README.md LICENSE.md dist-package/
          tar -czvf "typesetok-desktop-workbench-${{ needs.check-release.outputs.tag_name }}.tar.gz" dist-package

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbench-bundle
          path: typesetok-desktop-workbench-*.tar.gz

  # ──────────────────────────────────────────────
  # 3. Create GitHub Release & Attach Assets
  # ──────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [check-release, build-binaries, build-frontend]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: TypesetOK ${{ needs.check-release.outputs.tag_name }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## TypesetOK (TOK) ${{ needs.check-release.outputs.tag_name }} — שדרוג טיפוגרפי מתקדם, עימוד רב-תזרימי, וכלי טקסט עבריים

            ### 🚀 מה חדש בגרסה ${{ needs.check-release.outputs.tag_name }}:
            - **מנוע מצולעים ושבירת שורות משתנה (Polygon & Variable-Width Slicing):**
              - תמיכה מלאה במסגרות טקסט לא-מלבניות (`VariableWidthPolygonEngine`) וחיתוך Scanline רציף.
              - פריסת L-Shape דינמית לספיגת פירושים צמודים (L-shaped commentary absorption) ללא חפיפות גאומטריות.
              - יישור עברי (Justification) מותאם לשורות ברוחב משתנה עם היסט שורות ואילוצי RTL מדויקים.
            - **אותיות פתיחה עבריות (Hebrew Drop Caps & Sacred Opening Words):**
              - שייפר אותיות פתיחה (`HebrewDropCapShaper`) עם חישוב מדויק של תיבות חוסמות לניקוד וטעמים.
              - שילוב חלון אות פתיחה בתוך שבירת השורות של Knuth-Plass ויישור מושלם לשורת הבסיס.
            - **מנוע קסקדת עוגנים רב-תזרימי דו-כיווני (Multi-Flow Anchor Cascade Engine):**
              - מודל עוגנים דו-כיווני (`MultiFlowAnchorMap`) המקשר באופן דינמי בין טקסט מרכזי למפרשים.
              - הוספת או עריכת טקסט בתזרים הראשי מקדמת ומאזנת אוטומטית את גלישת הפירושים המקושרים.
              - הכללת `CoPaginationEngine` לתמיכה במספר תזרימים שרירותי (תלמוד, מקראות גדולות עם 4 מפרשים).
              - איזון גבהי טורים משותף (Shared column height balancing) בין עמודים עוקבים.
            - **כלי ניקוי טקסט עברי והדגשת דיבורי המתחיל (Hebrew Text Cleanup & Dibur HaMatchil):**
              - מודאל ניקוי טקסט אינטראקטיבי (`TextCleanupModal`) עם תצוגה מקדימה וסטטיסטיקה חיה.
              - זיהוי והדגשה אוטומטית של דיבורי המתחיל (Dibur HaMatchil auto-bolding).
              - נרמול גרשיים, מרכאות, מקפים ושמות קודש תוך שימור מלא של מיקומי העיצוב (Span offsets).
            - **יבוא מסמכים ואינטגרציית מערכת הפעלה:**
              - שיוך קובצי `.tok` למערכת ההפעלה ופתיחה ישירה דרך דאבל-קליק או שורת הפקודה (CLI argv).
              - יבוא ישיר ודקומפרסיה של מסמכי Word (.docx) לתוך מודל המסמך.
              - שמירה על ממדי עמודים ושוליים מותאמים אישית בהפקת `PageLayoutBox` ובייצוא.
            - **שיפורי ממשק משתמש ונגישות (UX & Accessibility):**
              - סנכרון חי בזמן אמת של עריכת טקסט מול תצוגת הקנבס (`SpreadCanvas`).
              - שינוי שם מסמך אינליין ב-`TopSystemBar` ורשימת הפרויקטים האחרונים.
              - תיקון נעילת יציאה בדיאלוג שמירה בעת ביטול או סגירת חלון.
              - ליטוש ערכות נושא ומניעת קריסת פקדים בתצוגה מפוצלת.

            ### 📦 קבצים להורדה (Downloads):
            - **מתקין רשמי למחשב (מומלץ):** `TypesetOK-${{ needs.check-release.outputs.tag_name }}-Setup.exe`
            - **גרסה ניידת ללא התקנה (Portable):** `TypesetOK-${{ needs.check-release.outputs.tag_name }}-windows-desktop-app.zip`
            - **CLI בלבד (Windows x64):** `tok-cli-${{ needs.check-release.outputs.tag_name }}-windows-x64.zip`
            - **Workbench Source Bundle:** `typesetok-desktop-workbench-${{ needs.check-release.outputs.tag_name }}.tar.gz`

            ### 📦 קבצים להורדה (Downloads):
            - **מתקין רשמי למחשב (מומלץ):** `TypesetOK-${{ needs.check-release.outputs.tag_name }}-Setup.exe`
            - **גרסה ניידת ללא התקנה (Portable):** `TypesetOK-${{ needs.check-release.outputs.tag_name }}-windows-desktop-app.zip`
            - **CLI בלבד (Windows x64):** `tok-cli-${{ needs.check-release.outputs.tag_name }}-windows-x64.zip`
            - **Workbench Source Bundle:** `typesetok-desktop-workbench-${{ needs.check-release.outputs.tag_name }}.tar.gz`
