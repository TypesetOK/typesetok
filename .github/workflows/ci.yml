name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR (do not cancel main branch runs)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Override any local .cargo/config.toml target-dir to prevent path issues
  CARGO_BUILD_TARGET_DIR: target

jobs:
  # ──────────────────────────────────────────────
  # Formatting check (fast, single OS)
  # ──────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ──────────────────────────────────────────────
  # Clippy linting (fast, single OS)
  # ──────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ──────────────────────────────────────────────
  # Build & Test (cross-platform matrix)
  # ──────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Verify bit-for-bit determinism
        run: cargo run -p tok-cli -- verify-determinism

  # ──────────────────────────────────────────────
  # Verify determinism (PDF & HTML bit-for-bit)
  # ──────────────────────────────────────────────
  determinism:
    name: Determinism Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify bit-for-bit determinism
        run: cargo run -p tok-cli -- verify-determinism

  # ──────────────────────────────────────────────
  # Frontend & Electron Shell (Node.js & TypeScript)
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend & Electron Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The frontend integration tests spawn the real tok-cli engine binary.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tok-cli (debug) for frontend integration tests
        run: cargo build -p tok-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build TypeScript packages & UI bundle
        run: npm run build
      - name: Run frontend unit tests
        run: npm test

